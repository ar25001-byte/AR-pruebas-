# Azure DevOps Pipeline - Solución AR (.NET 6.0)
# Trigger automático para compilación y ejecución de pruebas unitarias

trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'AR.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Instalar .NET 6.0 SDK'
  inputs:
    packageType: 'sdk'
    version: '6.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: DotNetCoreCLI@2
  displayName: 'Restaurar dependencias NuGet (dotnet restore)'
  inputs:
    command: 'restore'
    projects: '$(solution)'
    feedsToUse: 'select'

- task: DotNetCoreCLI@2
  displayName: 'Compilar Solución AR (dotnet build)'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Ejecutar Pruebas MSTest y xUnit (dotnet test)'
  inputs:
    command: 'test'
    projects: '**/*[Tt]est*/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build --collect "Code Coverage"'
    testRunTitle: 'Ejecución de Pruebas Unitarias AR (MSTest + xUnit)'
